<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JWT Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h2>JWT Login Demo (Hardcoded User)</h2>

  <div>
    <input id="username" placeholder="Username" value="admin" />
    <input id="password" type="password" placeholder="Password" value="admin@123" />
    <button onclick="login()">Login</button>
    <button onclick="getSecure()">Access Secure Route</button>
  </div>

  <pre id="output"></pre>

</body>
<script>

const api = axios.create({
  baseURL: "http://localhost:4000/api",
});

async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  try {
    const res = await api.post("/login", { username, password });
    localStorage.setItem("token", res.data.token);
    show(res.data);
  } catch (err) {
    show(err.response.data);
  }
}

async function getSecure() {
  const token = localStorage.getItem("token");
  if (!token) return show({ message: "Please login first." });

  try {
    const res = await api.get("/secure", {
      headers: { Authorization: `Bearer ${token}` },
    });
    show(res.data);
  } catch (err) {
    show(err.response.data);
  }
}

function show(data) {
  document.getElementById("output").textContent = JSON.stringify(data, null, 2);
}

</script>
</html>
